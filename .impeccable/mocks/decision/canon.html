<!doctype html>
<html><head><meta charset="utf-8"><title>RadarPro: category standard</title>
<style>
:root{--k:#121417;--k2:#1a1d22;--k3:#2a2f37;--ink:#d7dbe0;--mut:#9aa3ad;--ac:#739BD0}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--k);color:var(--ink);font:500 14px/1.3 system-ui,"Segoe UI",sans-serif;position:relative}
.top{position:absolute;inset:0 0 auto 0;height:52px;background:var(--k2);border-bottom:1px solid var(--k3);display:flex;align-items:center;gap:14px;padding:0 16px}
.mark{font-weight:700;font-size:16px}.mark b{color:var(--ac)}
.sel{background:var(--k3);padding:7px 12px;border-radius:6px}
.grp{display:flex;background:var(--k3);border-radius:6px;padding:2px}.grp span{padding:6px 10px;border-radius:5px;font-weight:600}.grp span.on{background:var(--ac);color:#0b0d10}
.mut{color:var(--mut)}
aside{position:absolute;left:0;top:52px;bottom:76px;width:260px;background:var(--k2);border-right:1px solid var(--k3);padding:14px}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 8px}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--k3)}
.sw{width:30px;height:16px;border-radius:8px;background:var(--k3)}.sw.on{background:var(--ac)}
.map{position:absolute;left:260px;top:52px;right:0;bottom:76px;background:
 radial-gradient(ellipse 60px 40px at 58% 38%,#e33 0 20%,#f90 30%,#ee3 45%,#2b8a3e 70%,transparent 72%),
 radial-gradient(ellipse 140px 70px at 55% 42%,#3cb44b55 0 60%,transparent 62%),#15181c}
.bot{position:absolute;left:0;right:0;bottom:0;height:76px;background:var(--k2);border-top:1px solid var(--k3);display:flex;align-items:center;gap:12px;padding:0 16px}
.b{width:38px;height:38px;border-radius:6px;background:var(--k3);display:grid;place-items:center}.b.p{background:var(--ac);color:#0b0d10}
.slider{flex:1;height:6px;border-radius:3px;background:var(--k3);position:relative}.slider i{position:absolute;left:0;width:58%;height:6px;border-radius:3px;background:var(--ac)}
</style></head><body>
<div class="top"><div class="mark">Radar<b>Pro</b></div><div class="sel">KTLX · Norman, OK ▾</div>
<div class="grp"><span class="on">REF</span><span>VEL</span><span>SRV</span><span>CC</span><span>ZDR</span><span>PHI</span><span>SW</span></div>
<div class="grp"><span class="on">0.5°</span><span>0.9°</span><span>1.3°</span><span>1.8°</span><span>2.4°</span></div>
<div class="mut">15:58:54Z · 2 min ago</div></div>
<aside><h3>Layers</h3><div class="row">Live radar<i class="sw on"></i></div><div class="row">MRMS mosaic<i class="sw"></i></div><div class="row">Warnings<i class="sw on"></i></div><div class="row">Range rings<i class="sw on"></i></div><div class="row">Rainbow tiles<i class="sw"></i></div>
<h3>Tools</h3><div class="row">Cross-section</div><div class="row">Color tables</div><div class="row">Archive</div><div class="row">Settings</div></aside>
<div class="map"></div>
<div class="bot"><div class="b">‹</div><div class="b p">▶</div><div class="b">›</div><div class="slider"><i></i></div><div class="sel">Forecast: HRRR 2 m Temp ▾</div></div>
</body></html>
