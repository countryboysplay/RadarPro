[package]
name = "radarpro-desktop"
version = "0.1.0"
description = "RadarPro desktop shell (Tauri) -- wraps apps/web's existing frontend in a native window. See Agent Context/context/stages/S10-desktop-beta.md."
authors = ["RadarPro contributors"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# This crate is intentionally its OWN Cargo workspace (empty `[workspace]`
# below), not a member of the root RadarPro workspace's `Cargo.toml`. Tauri
# pulls in a large, platform-specific dependency graph (WebView2 bindings on
# Windows, GTK/WebKitGTK on Linux, etc.) that has nothing to do with the
# core radar/forecast crates and must not affect their build, clippy, or CI
# behavior -- see GLOBAL_CONTRACT's architecture rules and this stage's
# "Windows only for this task" scope note. Without this empty table, Cargo
# would walk up from here and silently fold this crate into the root
# workspace the first time anyone ran a workspace-wide command from
# `C:\RadarPro`.
[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
# S10 Phase 4 update strategy: Tauri's own updater plugin, verifying update
# packages against a self-generated Ed25519/minisign keypair (see
# `tauri.conf.json`'s `plugins.updater.pubkey`) -- a free, no-CA mechanism
# unrelated to the Windows code-signing this project has explicitly decided
# against (see `Agent Context/context/stages/S10-desktop-beta.md`'s "Code
# signing" section). `tauri-plugin-process` supplies `relaunch()`, used to
# restart into the newly-installed version after an update completes.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Native (CORS-free) HTTP transport for Rainbow Weather tile fetches -- see
# `src/rainbow.rs`'s module doc comment. `api.rainbow.ai` sends no CORS
# headers for any browser origin (verified; see the
# radarpro-rainbow-cors-no-browser-support memory), so the webview's own
# `fetch()` can never load these tiles; native HTTP has no CORS enforcement
# at all. Same `rustls-no-provider` + explicit `ring` provider setup as
# `crates/radar-cache` (see that crate's `Cargo.toml` comment and
# `docs/adr/0008-live-data-pipeline-architecture.md`) -- avoids both
# `native-tls` (OpenSSL/C toolchain) and rustls's `aws-lc-rs` default
# provider (cmake/nasm), reusing the one combination already empirically
# verified to build and make a real HTTPS request in this project.
reqwest = { version = "=0.13.5", default-features = false, features = [
    "rustls-no-provider",
] }
rustls = { version = "=0.23.35", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }

# Encodes fetched tile bytes for the JSON-over-IPC return convention this
# crate already uses (see `get_diagnostics`'s plain-struct return) -- no
# `ArrayBuffer`/binary-IPC precedent exists yet in this codebase, so a
# base64 string keeps this consistent with that existing convention rather
# than introducing a new one for a single command.
base64 = "=0.22.1"
