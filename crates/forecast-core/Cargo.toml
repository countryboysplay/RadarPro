[package]
name = "forecast-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "S08: generic gridded-forecast-field abstraction (ForecastProvider/ForecastGrid/EnsembleStatistic/etc.) extracted from S07's provider-gefs, validated by a second concrete provider (provider-hrrr). Owns the provider-agnostic GPU grid renderer; provider-specific bucket/key/.idx/GRIB2-decode wiring stays in each provider crate."

[dependencies]
# The provider-agnostic GPU grid-render pipeline (moved here from
# provider-gefs's own `gpu.rs`/`render.rs`/`shaders/gefs_grid.wgsl`, S08).
# `radar-render`'s palette LUT machinery and generic GPU plumbing
# (`GpuContext`, `RenderTarget`, `render_frame`, `read_rgba8`, palette
# texture upload) are reused directly through its public API rather than
# duplicated a third time (once for `radar-render` itself, once here) --
# see `src/gpu.rs`'s module doc.
radar-render = { path = "../radar-render" }
wgpu = "=30.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }

# Used only by `src/gpu_tests.rs` (`#[cfg(test)]`) to block on
# `GpuContext::request()` -- listed as a normal dependency rather than a
# dev-dependency to match `provider-gefs`'s own established pattern for the
# exact same use.
pollster = "=1.0.1"

# `src/sleep.rs`'s native `tokio::time::sleep` -- only the `time` feature is
# needed here (moved from `provider-hrrr`, which pulls in the fuller
# `rt`/`time`/`macros` set for its own HTTP client's async runtime; the
# actual timer driver that makes this crate's `time` feature functional at
# runtime comes from that same caller-provided runtime). Same pinned
# version already used throughout this workspace.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "=1.47.1", features = ["time"] }

# `js_sys::Date::now()` -- `src/time.rs`'s `unix_seconds_now()` wasm32
# clock source (`std::time::SystemTime::now()` panics unconditionally on
# `wasm32-unknown-unknown`; see that function's own doc comment). Same
# pinned version already resolved elsewhere in this workspace
# (`radar-web`/`weather-alerts`/`forecast-web`/`provider-hrrr`).
#
# `wasm-bindgen-futures`/`web-sys` back `src/sleep.rs`'s wasm32
# `window.setTimeout` shim, moved here from `provider-hrrr` once
# `provider-gefs` needed the exact same shim -- same pinned versions
# `provider-hrrr` already resolved for the same job.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.105"
wasm-bindgen-futures = "=0.4.78"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "=0.3.105"
# Only `Window`, for `web_sys::window()` and its `set_timeout_with_*`
# methods -- not a blanket `features = ["*"]` enable.
features = ["Window"]
