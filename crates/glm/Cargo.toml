[package]
name = "glm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Phase 4: GOES Geostationary Lightning Mapper (GLM) Level 2 flash decoding -- flash positions and times from the netCDF4/HDF5 LCFA files NOAA publishes every 20 s -- plus a thin wasm-bindgen API for the browser."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pure-Rust HDF5 reader (netCDF4 is HDF5): no C library, builds for wasm32.
# Its deflate feature uses the workspace's existing flate2 1.1.5.
hdf5-pure = "=0.47.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"

[target.'cfg(target_arch = "wasm32")'.dependencies.console_error_panic_hook]
version = "=0.1.7"
