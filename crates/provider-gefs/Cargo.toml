[package]
name = "provider-gefs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "S07: NOAA GEFS ensemble forecast proof of concept -- moves one real field (2m temperature) end-to-end from the anonymous noaa-gefs-pds S3 bucket to a rendered GPU image, proving the GRIB2/ensemble pipeline works. Not a general forecast framework (see the S07 stage file's Critical rule)."

[dependencies]
# GRIB2 decode. `default-features = false`: the `grib` crate's default
# features (`jpeg2000-unpack-with-openjpeg`, `ccsds-unpack-with-libaec`,
# `gridpoints-proj`) each pull in a *C/C++* dependency (openjpeg-sys,
# libaec-sys, proj-sys via cmake) that fails to build in this environment
# (no C/C++ toolchain wired up for CMake's `TryCompile` step -- verified
# empirically: `cargo build` with default features fails in `proj-sys`'s
# build script). None of those three features are needed for GEFS's
# `pgrb2sp25` product: every real message fetched for this crate uses Grid
# Definition Template 3.0 (regular lat/lon -- `Template3_0::latlons_unchecked`
# needs no PROJ) and Data Representation Template 5.3 (complex packing with
# spatial differencing -- not JPEG2000/PNG/CCSDS). See
# `docs/adr/0011-gefs-grib2-crate-selection-and-limitations.md`.
grib = { version = "=0.18.5", default-features = false }

thiserror = "=2.0.20"

# HTTP client for anonymous S3 `ListObjectsV2`/`GetObject`+Range GET calls
# against the public `noaa-gefs-pds` bucket. Pinned to the exact same
# version/feature set `radar-cache` already uses and has verified builds and
# makes real HTTPS requests in this exact environment with no C toolchain
# (`rustls-no-provider` + explicit `ring` provider below, avoiding both
# `native-tls`/OpenSSL and rustls's `aws-lc-rs` default, which needs cmake).
reqwest = { version = "=0.13.5", default-features = false, features = [
    "rustls-no-provider",
] }
rustls = { version = "=0.23.35", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }

# Async runtime backing the HTTP client above. Only `rt`/`time`/`macros`:
# the same minimal, empirically-sufficient feature set `radar-cache` already
# uses for the same `reqwest` version (no `fs` here -- this crate never
# touches the local filesystem itself).
tokio = { version = "=1.47.1", features = ["rt", "time", "macros"] }

# S3 `ListObjectsV2` (member/run-hour discovery) returns XML; same pinned
# version `radar-cache` already uses for the same job.
quick-xml = "=0.42.0"

# GPU rendering: the regular lat/lon grid gets its own simple textured-quad
# pipeline (see `src/shaders/gefs_grid.wgsl`) rather than being forced
# through `radar-render`'s polar-radial lookup-texture machinery (per
# `ARCHITECTURE.md`: "Do not force polar radar and gridded model data into
# the same geometry representation"). `radar-render`'s palette LUT
# machinery (a generic value->RGBA8 ramp, nothing polar-specific) *is*
# reused directly through its public API rather than duplicated.
radar-render = { path = "../radar-render" }
wgpu = "=30.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=1.0.1"

# Only used by `src/bin/harness.rs`, to save one rendered frame as a PNG so
# a human (or this task's own verification) can confirm the render is
# geographically correct.
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
tokio = { version = "=1.47.1", features = ["rt-multi-thread"] }

# Named explicitly (rather than left to default to the `harness.rs`
# filename stem) to avoid an output-filename collision with
# `radar-render`'s own `src/bin/harness.rs` binary -- `cargo build
# --workspace` warned about exactly this collision before this was added.
[[bin]]
name = "provider-gefs-harness"
path = "src/bin/harness.rs"
