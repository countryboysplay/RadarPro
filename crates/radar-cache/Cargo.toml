[package]
name = "radar-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "S04: live NEXRAD Level II data pipeline -- site directory, discovery, download, atomic on-disk cache, retries, cancellation, background updates, and scan history."

[dependencies]
radar-types = { path = "../radar-types" }
nexrad-level2 = { path = "../nexrad-level2" }

thiserror = "=2.0.20"

# Embedded site directory (fixtures/wsr88d-sites.json) and the on-disk cache
# sidecar metadata files.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# S3 `ListObjectsV2` returns XML; `quick-xml`'s pull parser lets us walk it
# with bounds-checked, allocation-light, non-panicking code (no schema
# derive/serde-xml needed for the handful of fields we read).
quick-xml = "=0.42.0"

# Async runtime backing discovery/download/retry/cancellation/the background
# update loop. Only the specific features this crate's own code uses are
# enabled: `rt` (spawn/JoinHandle for the background loop), `time`
# (sleep/backoff), `fs` (async cache file I/O), `macros` (`tokio::select!`
# itself is macro-generated by the `tokio-macros` proc-macro crate, gated
# behind this feature -- verified empirically, not just from the docs: a
# build with only `rt`/`time`/`fs` fails with "cannot find `select` in
# `tokio`"). `rt-multi-thread` (a multi-thread runtime, needed to run
# `#[tokio::test]` and this crate's own tests) is added only as a
# dev-dependency below, since only tests need it.
tokio = { version = "=1.47.1", features = ["rt", "time", "fs", "macros"] }

# `tokio_util::sync::CancellationToken`: the cancellation mechanism a caller
# uses to abandon an in-flight discovery/download/retry loop or stop the
# background update loop (GLOBAL_CONTRACT: "cancellation/deprioritization is
# required for stale network/decode work"). `default-features = false`
# because `CancellationToken` itself needs no optional tokio-util feature
# (it depends only on `tokio::sync`, which `tokio-util` always requires).
tokio-util = { version = "=0.7.19", default-features = false }

# HTTP client for anonymous S3 `ListObjectsV2`/`GetObject` calls.
# `default-features = false` plus `rustls-no-provider` avoids `native-tls`
# (OpenSSL, needs a C toolchain -- none is available in this environment,
# same constraint that led `nexrad-level2` to `bzip2-rs` over `bzip2-sys`)
# **and** avoids rustls's other default crypto provider, `aws-lc-rs`, which
# also needs a C/C++ toolchain (cmake) to build `aws-lc-sys`. See
# `docs/adr/0008-live-data-pipeline-architecture.md` for the empirical
# verification that built and made a real HTTPS request in this exact
# environment.
reqwest = { version = "=0.13.5", default-features = false, features = [
    "rustls-no-provider",
] }

# Paired with `reqwest`'s `rustls-no-provider` feature: selects the `ring`
# crypto provider explicitly (pure-Rust-plus-precompiled-per-target-assembly,
# no C compiler invoked on this target/platform) instead of the `aws-lc-rs`
# default.
rustls = { version = "=0.23.35", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }

[dev-dependencies]
tokio = { version = "=1.47.1", features = ["rt-multi-thread"] }
