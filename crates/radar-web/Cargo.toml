[package]
name = "radar-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Browser/WebAssembly glue exposing nexrad-level2 decode + radar-geo polar-geometry math + radar-render's wgpu pipeline and color-table format to a <canvas>. An adapter crate (ARCHITECTURE.md: 'map integration is an adapter boundary, not a core dependency') -- it contains no decoding, geometry, or palette logic of its own: wasm-bindgen plumbing, the wgpu Surface-acquisition/presentation code the native radar-render harness never needed, and (since S05) decode-once/re-render-any-(elevation,moment)-selection, color-table load/apply, cursor-probe, and range-ring APIs built on top of already-proven radar-geo/radar-render functions."

[lib]
# `cdylib` is what `wasm-bindgen`/`wasm-pack` compile into the browser-loaded
# `.wasm` module; `rlib` keeps this crate usable as an ordinary Rust
# dependency too (e.g. `cargo test -p radar-web` on the host target, which
# only exercises `sweep_select` -- see that module and `src/lib.rs`).
crate-type = ["cdylib", "rlib"]

[dependencies]
# Needed unconditionally: `sweep_select`/`render_select` (pure sweep-
# picking/selection logic, unit tested on the host target) depend on
# `radar_types::{Volume, MomentKind, Sweep}`.
radar-types = { path = "../radar-types" }
# Needed unconditionally (S11 Phase 2b): `srv_select` (pure Storm-Relative
# Velocity sweep-transform logic, unit tested on the host target) depends
# on `radar_geo::storm_relative_velocity`. `radar-geo` itself has no
# wasm-specific requirement (it depends only on `radar-types`), so -- like
# `radar-types` above -- it does not need wasm32-gating; `browser.rs`
# (wasm32-only) also uses it for cursor-probe/range-ring logic, now via
# this same unconditional dependency instead of a separate wasm32-only one.
radar-geo = { path = "../radar-geo" }

# Everything below is real browser/GPU glue and is wasm32-only: `wgpu`'s
# `SurfaceTarget::Canvas` variant, and every `web-sys`/`wasm-bindgen` type,
# are only *defined* under `cfg(target_arch = "wasm32")` in the first place
# (wgpu's own `web` cfg alias requires it), so gating the dependencies
# themselves keeps a native `cargo build --workspace` from ever needing to
# resolve/build a browser GPU stack it cannot use.
[target.'cfg(target_arch = "wasm32")'.dependencies]
nexrad-level2 = { path = "../nexrad-level2" }
radar-render = { path = "../radar-render" }

# Same pin as `radar-render`, plus the `webgl` feature (not on by default)
# so a browser without WebGPU still gets the WebGL2 fallback backend --
# see `src/browser.rs` module docs for how the two are negotiated.
wgpu = { version = "=30.0.1", default-features = true, features = ["webgl"] }

# Pinned to the exact versions already resolved transitively by `wgpu`'s own
# `web`/`webgpu` features in this workspace's `Cargo.lock`, so this crate's
# `web_sys::HtmlCanvasElement`/`wasm_bindgen::JsValue` etc. are the *same*
# types `wgpu`'s web backend expects at its public API boundary (mismatched
# versions of these crates are not interchangeable, even with identical
# names).
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"

# Only the browser APIs this crate actually calls: canvas handles (received
# from JS, passed straight to `wgpu`) and `console.error` logging (the panic
# hook). Not a blanket `features = ["*"]` enable.
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "=0.3.105"
features = ["HtmlCanvasElement", "console"]

# Turns a Rust panic into a real, readable `console.error` message (with
# location and message) instead of the opaque "unreachable executed" trap a
# panicking wasm32 binary otherwise surfaces -- see `src/browser.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies.console_error_panic_hook]
version = "=0.1.7"

[dev-dependencies]
# Unconditional (not wasm32-gated): `src/render_select.rs`'s host-run
# `#[test]`s decode the real KTLX fixture and build its GPU-buffer-input
# representation on the native target, to prove "decode once, then build
# input for two different (elevation, moment) selections without a second
# decode call" structurally (see that module). Neither dependency has any
# wasm-specific requirement -- both are already used natively by
# `radar-render`'s own harness/tests -- so this is safe on every target
# without pulling any browser/GPU stack into a native, non-test build.
nexrad-level2 = { path = "../nexrad-level2" }
radar-render = { path = "../radar-render" }
